
services:
  postgres:
    image: postgres:15-alpine
    container_name: cybersaarthi-postgres
    environment:
      POSTGRES_DB: cybersaarthi
      POSTGRES_USER: cybersaarthi
      POSTGRES_PASSWORD: cybersaarthi_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cybersaarthi -d cybersaarthi" ]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.16.0-community
    container_name: cybersaarthi-neo4j
    environment:
      NEO4J_AUTH: neo4j/cybersaarthi_graph_pass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybersaarthi-backend
    environment:
      - POSTGRES_URI=postgresql://cybersaarthi:cybersaarthi_secure_pass@postgres:5432/cybersaarthi
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cybersaarthi_graph_pass
      - AI_API_KEY=${AI_API_KEY:-}
      - JWT_SECRET=cybersaarthi_super_secret_jwt_key_sih_2026
      - PADDLE_PDX_MODEL_SOURCE=BOS
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - paddle_models:/root/.paddlex

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybersaarthi-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  paddle_models:
